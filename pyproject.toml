]
"src/loomstroke/ui/context_toolbar/text_toolbar.py" = [
    "PLC0415",
    "PLR0915",
]
"src/loomstroke/ui/panels/layer_panel.py" = [
    "PLR0911",
]
"src/loomstroke/ui/panels/preview/preview_presenter.py" = [
    "PLC0415",
    "PLR0911",
    "PLR0912",
    "PLR0915",
]
"src/loomstroke/ui/panels/tool_panel.py" = [
    "PLC0415",
]
"src/loomstroke/ui/widgets/property_widget_factory.py" = [
    "PLC0415",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
# mypy_path = ["src"]: src-layout で duplicate module を回避。
# explicit_package_bases と組み合わせることで、src/loomstroke/** を
# "loomstroke.*" のみで解決させ、"src.loomstroke.*" の二重名を抑止する。
# (Pre-release audit §12-C #11b 残, 2026-04-11)
mypy_path = ["src"]
explicit_package_bases = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "psutil",
    "psutil.*",
    "scipy",
    "scipy.*",
    "py_cpuinfo",
    "pywin32",
    "pywin32.*",
    "numba",
    "numba.*",
    "PySide6",
    "PySide6.*",
    "qasync",
    "PIL",
    "PIL.*",
    "cryptography",
    "cryptography.*",
    "keyring",
    "keyring.*",
]
ignore_missing_imports = true

# Pre-release audit §12-M-11 Bucket C — Qt 動的属性 (signal / property の
# 型表現限界) で attr-defined が大量発生するモジュールに限定して
# disable_error_code を設定する。これらは QWidget サブクラスで signal を
# class attribute として定義する慣習に起因し、静的型システムの表現力を
# 超える Bucket C (§12-M-4) に分類されたもの。本番コードは無変更。
[[tool.mypy.overrides]]
module = [
    "loomstroke.ui.panels.workflow_panel",
    "loomstroke.ui.panels.comfyui_panel",
    "loomstroke.ui.panels.prompt_panel",
    "loomstroke.ui.panels.node_panel",
    "loomstroke.ui.dialogs.plugin_compatibility_dialog",
]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = [
    "loomstroke.plugins.*",
    "src.loomstroke.plugins.*",
]
ignore_errors = true

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = false
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-p",
    "no:cacheprovider",
    "--import-mode=importlib",
    "--basetemp=user_data/pytest_tmp",
]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "qt: marks tests that require pytest-qt",
    "gpu: marks tests that require or probe GPU backends",
    "headless: marks tests that verify offscreen/headless runtime behavior",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == '__main__':",
    "raise NotImplementedError",
    "pass",
    "except ImportError:",
]

[tool.setuptools]
license-files = ["LICENSE", "LICENSE_JA", "THIRD_PARTY_LICENSES"]

[tool.setuptools.package-dir]
"" = "src"



[tool.setuptools.package-data]
"loomstroke.io" = [
    "lstroke_manifest_schema_v1.json",
    "resources/icc/*.icc",
    "resources/icc/*.ICC",
    "resources/icc/*.json",
    "resources/icc/*.txt",
]
"loomstroke.ui" = [
    "resources/i18n/*.qm",
    "resources/layouts/*.json",
    "icons/*.svg",
]
"loomstroke.plugins.prompt_editor" = ["manifest.json"]
"loomstroke.plugins.basic_pen" = ["icons/*.svg"]
"loomstroke.plugins.basic_eraser" = ["icons/*.svg"]
"loomstroke.plugins.basic_fill_bucket" = ["icons/*.svg"]
"loomstroke.plugins.basic_move" = ["icons/*.svg"]
"loomstroke.plugins.basic_selection" = ["icons/*.svg"]
"loomstroke.plugins.color_manager" = ["icons/*.svg"]
"loomstroke.plugins.shape_manager" = ["icons/*.svg"]
"loomstroke.plugins.text_tool" = ["icons/*.svg"]
"loomstroke.plugins.vector_tools" = ["icons/*.svg"]
