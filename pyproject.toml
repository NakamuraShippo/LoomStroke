    "PLR0915",
]
"src/loomstroke/plugins/comfyui/extended_service.py" = [
    "PLR0912",
    "PLR0915",
]
"src/loomstroke/plugins/comfyui/ui/main_panel.py" = [
    "PLR0912",
    "PLR0915",
]
"src/loomstroke/plugins/vector_tools/parametric_shapes.py" = [
    "PLR0915",
]
"src/loomstroke/ui/canvas/canvas_widget.py" = [
