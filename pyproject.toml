[build-system]
requires = ["setuptools>=65", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "loomstroke"
version = "0.3.0.7.18"
description = "Plugin-based paint application with AI integration"
authors = [{name = "LoomStroke Team"}]
license = {text = "Proprietary"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Editors",
]

dependencies = [
    "PySide6==6.10.*",
    "wgpu==0.31.0",
    "numpy>=1.24.0,<2.4",
    "Pillow>=12.1.1",
    "opencv-python-headless>=4.8.0",
    "aiohttp>=3.13.4",
    "aiofiles>=23.0.0",
    "qasync>=0.27.0",
    "numba>=0.58.0",
    "jsonschema>=4.19.0",
    "packaging>=24.0",
    "cryptography>=46.0.6",
    "defusedxml>=0.7.0",
    "psd-tools>=1.9.0",
    # Phase 8a: required to route API keys through OS-native credential
    # storage (Windows Credential Manager / DPAPI, macOS Keychain,
    # Linux Secret Service). When keyring is missing, paid API key save
    # / read paths fail closed instead of writing a co-located Fernet
    # key + ciphertext fallback.
    "keyring>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.15.10,<0.16.0",
    # Upper bounds pin to next major to prevent CI drift from new rules/breaks
    # (R-H1, Pre-release audit §12-I). Lock file currently at:
    # black==26.3.1 / isort==8.0.1 / mypy==1.20.0 — all within bounds below.
    "black>=23.0.0,<27.0.0",
    "isort>=5.12.0,<9.0.0",
    "mypy>=1.5.0,<2.0.0",
    "types-Pillow",
    "types-jsonschema>=4.21.0",
    "scipy-stubs",
    "types-pywin32",
]

nanobanana = [
    "Pillow>=10",
    "google-genai>=0.3; python_version>='3.11'",
]

[project.urls]
Homepage = "https://github.com/NakamuraShippo/LoomStroke"
Documentation = "https://loomstroke.app/docs"
Repository = "https://github.com/NakamuraShippo/LoomStroke.git"
Issues = "https://github.com/NakamuraShippo/LoomStroke/issues"

[project.scripts]
loomstroke = "loomstroke.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["loomstroke*"]
namespaces = true

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    __pycache__
  | \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "__pycache__",
    "*.pyc",
    "*.pyo",
    "*.nbi",
    "*.nbc",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "PL",   # pylint
    "RUF",  # ruff-specific rules
]
ignore = [
    "E203",  # whitespace before ':'
    "PLR0913",  # Too many arguments
    "PLR2004",  # Magic value comparison
    "RUF100",  # Ignore unused noqa (existing inline suppressions in legacy files)
    # --- Added for ruff 0.15 upgrade (Pre-release #12c): new rules not
    # previously enforced; evaluated individually in separate tasks ---
    "PLW0108",  # Lambda may be unnecessary (many legitimate call-wrapping usages in tests)
    "UP042",    # str+Enum → StrEnum (semantics risk: pickle/subclass behavior; Alpha→Beta stability)
    "PLC0207",  # String split count optimization (low priority cleanup)
]

[tool.ruff.lint.isort]
combine-as-imports = false

[tool.ruff.lint.per-file-ignores]
# Magic values and asserts are fine in tests; RUF001 because Japanese test
# fixtures legitimately contain fullwidth punctuation (？！：).
"tests/**" = ["PLR2004", "S101", "RUF001"]
# Translation tables are exempt from line-splitting (AGENTS.md §8); long JA
# strings stay on one line so keys remain greppable.
"src/loomstroke/ui/translations.py" = ["E501"]
"src/loomstroke/plugins/basic_pen/pen_tool.py" = [
    "E402",
    "E501",
    "F401",
    "F811",
    "F821",
    "F841",
    "PLC0415",
    "RUF046",
    "SIM105",
]
"src/loomstroke/plugins/basic_move/move_tool.py" = [
    "PLR0911",
    "PLR0912",
    "PLR0915",
]
"src/loomstroke/plugins/basic_selection/rect_tool.py" = [
    "PLR0911",
    "PLR0912",
    "PLR0915",
]
"src/loomstroke/plugins/comfyui/service.py" = [
    "PLR0911",
]
"src/loomstroke/plugins/comfyui/ui/connection_bar.py" = [
    "PLR0915",
]
"src/loomstroke/plugins/comfyui/ui/node_tabs.py" = [
    "PLR0911",
    "PLR0912",
    "PLR0915",
]
"src/loomstroke/plugins/comfyui/ui/parameter_editor.py" = [
    "PLR0911",
]
"src/loomstroke/plugins/common/outbound_policy.py" = [
    "PLR0911",
]
"src/loomstroke/plugins/nanobanana/ui/panel.py" = [
