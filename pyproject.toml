# --- Added for Pre-release #12c: CI quality gate initial ruff errors ---
# Complexity violations in legacy files (PLR0911/0912/0915) and intentional
# lazy imports (PLC0415) are ignored per-file to unblock CI. Refactoring
# candidates are tracked separately in the pre-release audit.
"src/loomstroke/app_enhanced.py" = [
    "PLR0912",
]
"src/loomstroke/core/canvas_service_simple.py" = [
    "PLR0912",
    "PLR0915",
]
"src/loomstroke/core/commands.py" = [
